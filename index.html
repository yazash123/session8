VIEW.room=(function(){
  /* Our room opens on the whole container, then zooms into the room's corner of it.
     The risk being read grows in the middle; the room's other risks roll round it, the rest dim. */
  var el=$('#v-room'), order=[], idx=0, cur=0, pot=null, built=false, TM=null;
  function none(){
    el.innerHTML='<div class="wrap"><div class="waiting"><span class="sunlet" aria-hidden="true"></span>'+C('r.none','Pick your room first','h3')+
      '<p>'+C('r.noneh','Go to Set up, choose your room number and join. Your room’s risks will be here.')+'</p><button type="button" class="btn primary" id="r-go">'+C('r.togo','Set up')+'</button></div></div>';
    $('#r-go').onclick=function(){go('setup');}; cur=0;
  }
  function scene(n,zoom){
    var r=ROOM[n]; cur=n; order=r.r.slice(); idx=0;
    el.innerHTML='<div class="wrap"><div class="rq"><div class="rqq">'+C('r.central','Having read our risks, what do we want to achieve, and why?','h2','rqh')+
      C('r.sub','It’s okay if you don’t know how. Just describe what an action would achieve.','p','rqs')+'</div>'+
      '<div class="rqm"><span class="how-dot">Room '+n+' · '+F('area.'+r.a+'.n')+'</span><div class="rtools"><div class="tmr" id="r-tmr"></div>'+guideBtn('room')+
        '<button type="button" class="btn ghost sm" id="r-back">'+icon('prev')+C('r.back','Change room')+'</button></div></div>'+
      guidePanel('room',{read:'<button type="button" class="gbtn" id="g-tgo">'+icon('clock')+C('g.room.tgo','Start the timer')+'</button>',q:C('r.central','','p','gq')})+'</div></div>'+
      '<div class="rstage" id="r-stage"><div class="rpot" id="r-pot"></div>'+
      '<div class="rnav" id="r-nav"><button type="button" class="arrowb prev" id="r-prev" aria-label="Previous risk">'+icon('prev')+'</button>'+
      '<div class="sdots" id="r-dots">'+order.map(function(id,i){return '<button type="button" class="'+(isNew(id)?'new':'')+'" style="--c:'+rcol(id)+'" data-i="'+i+'" aria-label="'+esc(T('risk.'+id+'.mt'))+'">'+(i+1)+'</button>';}).join('')+'</div>'+
      '<button type="button" class="arrowb" id="r-next" aria-label="Next risk">'+icon('next')+'</button></div>'+
      '<div class="rtheme" id="r-theme">'+F('area.'+r.a+'.n','p','spa rth')+'</div>'+
      '<aside class="rpanel panel" id="r-panel" aria-live="polite"></aside></div>';
    $('#r-back').onclick=function(){go('setup');};
    $('#r-prev').onclick=function(){step(-1);}; $('#r-next').onclick=function(){step(1);};
    $('#r-dots').addEventListener('click',function(e){if(e.target.isContentEditable)return;var b=e.target.closest('[data-i]');if(b)go2(+b.dataset.i);});
    pot=Pot($('#r-pot'),{peek:true,cls:'roompot',bigAt:function(g){return {x:g.w/2,y:g.h/2};},
      onBall:function(id){var i=order.indexOf(id);if(i>=0)go2(i);}});
    TM=Timer('s8-timer-r'+n,'copy.g.room.r0.m',function(t){var nx=$('#r-next');if(!nx)return;var k=order.length,due=t.running?Math.floor((t.T-t.l)/(t.T/k)):-1;nx.classList.toggle('nudge',idx<k-1&&idx<due);});
    TM.mount($('#r-tmr'));
    $('#g-tgo').onclick=function(e){if(e.target.isContentEditable)return;if(TM.state().done)TM.reset();if(!TM.state().running)TM.start();guideToggle($('.ghb[aria-controls="g-room"]'),false);};
    built=true; var mh=$('.mast').offsetHeight; window.scrollTo(0,mh);
    size(); panel(false);
    /* the whole container first, then into this room's area, the risk being read in the middle */
    var lit={}; order.forEach(function(id){lit[id]=1;});
    pot.setLit(lit); pot.setView({x:0,y:0,s:1}); pot.st.big=null; pot.draw();
    if(zoom&&!reduce){$('#r-stage').classList.add('arriving');setTimeout(function(){place();setTimeout(function(){var s2=$('#r-stage');if(s2)s2.classList.remove('arriving');},700);},650);}
    else place();
  }
  /* the stage: the container on the left (above, on a phone), the risk's words beside it */
  function size(){
    var st=$('#r-stage'); if(!st)return; var W=st.clientWidth, wide=W>=980, rqh=$('.rq',el).offsetHeight;
    var H=wide?clamp(window.innerHeight-50-rqh-90,460,760):clamp(W*1.08,360,560), PW=wide?W*.58:W;
    st.classList.toggle('wide',wide); var bx=$('#r-pot'); bx.style.width=PW+'px'; bx.style.height=H+'px';
    var p=$('#r-panel'), th=$('#r-theme');
    /* the room's theme sits at the top of the right-hand column, the panel under it */
    if(wide){th.style.cssText='position:absolute;left:'+(PW+16)+'px;top:0;width:'+(W-PW-16)+'px';var tH=th.offsetHeight+14;
      p.style.cssText='position:absolute;left:'+(PW+16)+'px;top:'+tH+'px;width:'+(W-PW-16)+'px;max-height:'+(H+70-tH)+'px';}
    else{th.style.cssText='';p.style.cssText='';}
    var D=Math.min(PW*.6,H*.66,500), k=order.length-1;
    SZ={big:D/2,lit:clamp(Math.min(D*.2,(H-D)/2-4),40,60),dim:wide?24:15};
  }
  var SZ={big:200,lit:50,dim:22};
  function place(){
    if(!pot)return; var id=order[idx], g=pot.geom(), cx=0, cy=0;
    order.forEach(function(k){cx+=pot.U[k].x;cy+=pot.U[k].y;}); cx/=order.length; cy/=order.length;
    /* the camera stays on the room's corner of the container; the risk being read moves to the middle and the others roll round it */
    pot.setView({x:cx,y:cy,s:clamp(SZ.dim*2.4/(pot.U[id].r*g.R0),1.5,2.4)}); pot.setBig(id,SZ);
    $$('#r-dots [data-i]').forEach(function(b){b.setAttribute('aria-current',String(+b.dataset.i===idx));});
    $('#r-prev').disabled=idx===0; $('#r-next').disabled=idx===order.length-1; if(TM)TM.poke();
  }
  function go2(i){if(i!==idx&&i>=0&&i<order.length){idx=i;place();panel(true);}}
  function panel(anim){
    var id=order[idx], r=RISKS[id], p='risk.'+id+'.', box=$('#r-panel');
    function fill(){box.innerHTML='<div class="rhead">'+grpChip(id)+'<span class="code">'+(idx+1)+' / '+order.length+'</span></div>'+
      (isNew(id)?'<header class="rsec rnewh">'+F(p+'mt','h2','rtitle')+F(sumK(id),'p','rsum')+'</header>':'')+
      (descK(id)?F(descK(id),'div','ebody'):'')+
      '<section class="rsec"><h3>'+C('d.yours','In your own words')+'</h3>'+quoteList(rq(id))+'</section>';box.scrollTop=0;}
    if(anim&&!reduce){box.classList.add('out');setTimeout(function(){fill();box.classList.remove('out');},200);}else fill();
  }
  function step(d){go2(clamp(idx+d,0,order.length-1));}
  document.addEventListener('keydown',function(e){if(CUR!=='room'||!$('#r-stage')||e.target.isContentEditable||/INPUT|TEXTAREA/.test(e.target.tagName)||$('#drawer').classList.contains('on'))return;
    if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
  var rt=0;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(CUR==='room'&&$('#r-stage')){size();place();}},100);});
  return {show:function(sub,first){var n=+sub||ME.room;if(n&&ROOM[n]){if(first||cur!==n||!$('#r-stage'))scene(n,true);}else none();},sub:function(){return cur&&$('#r-stage')?String(cur):'';}};
})();

  document.addEventListener('click',function(e){if(!g.hidden&&!e.target.closest('#gloss,#m-gl'))open(false);});
  var FROM='setup';
  $('#m-rd').addEventListener('click',function(e){if(e.target.isContentEditable)return;open(false);if(CUR!=='read')FROM=CUR||'setup';go('read');});
  return {from:function(){return FROM;}};
})();

      AREAS.map(function(a){return '<section class="rdsec" id="rd-'+a.k+'" aria-labelledby="rdh-'+a.k+'"><h2 id="rdh-'+a.k+'">'+F('area.'+a.k+'.n')+'</h2><ol class="rdl">'+
        a.m.map(function(id){n++;var p='risk.'+id+'.',R=RISKS[id],nw=isNew(id);
          return '<li value="'+n+'"><h3><span class="rdn">'+n+'.</span> '+F(p+'mt')+(nw?' <span class="rdnew">New</span>':'')+'</h3>'+
            (!nw&&T(p+'t')&&T(p+'t')!==T(p+'mt')?'<p class="rdalt">'+esc(T('copy.rd.alt'))+' '+F(p+'t')+'</p>':'')+
            F(sumK(id),'p','rdsum')+(descK(id)&&T(descK(id))?F(descK(id),'div','rdbody'):'')+'</li>';}).join('')+'</ol></section>';}).join('')+
      '<p class="rdend"><a href="#rd-t">'+C('rd.top','Back to the top')+'</a></p></article></div>';
    $('#rd-back').addEventListener('click',function(e){if(e.target.isContentEditable)return;go(HELP.from());});
    el.addEventListener('click',function(e){var a=e.target.closest('a[href^="#rd-"]');if(!a||e.target.isContentEditable)return;e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));
      if(t){window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-$('#tabs').offsetHeight-12,behavior:reduce?'auto':'smooth'});}});
