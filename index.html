cieties will be excluded and most at risk from exploitation."], "mt": "A wider gap between those who have AI and those who don't"}, "N07": {"id": "N07", "kind": "N", "g": "work", "a": "B4", "t": "An AI money bubble", "s": "AI companies in heavy debt, and economies at risk if the bubble bursts.", "q": ["debt. at present all these large AI Companies are hugely in debt and the investors across the worls are very anxious to receive a dividend on their investments", "… A major risk is that the bubble will burst and the world could suffer its worst economic slump, possibly, ever"], "mt": "An AI money bubble"}, "N10": {"id": "N10", "kind": "N", "g": "work", "a": "B4", "t": "Jobs lost as employers replace people with AI", "s": "Job losses and unemployment as employers, including governments, use AI to cut staff, and the strain this puts on benefits.", "q": ["Advancement in AI drives high unemployment. As AI technology infiltrates across industry sectors, the efficencies provided by AI will lead to job losses and high unelmplyment", "An entire generation is under-employed and are  financially insecure"], "mt": "AI replacing people's jobs"}, "R06": {"id": "R06", "kind": "R", "g": "data", "a": "B5", "t": "Anyone can strip away AI's safety controls", "s": "Safety controls removed from AI models that anyone can copy and change.", "q": ["Worrying and dangerous  that anyone can strip away these controls /guardrails  and manipulate to cause mass damage harm  and harm", "… it's difficult to prevent someone from developing a harmful AI tool on their own computer, this falls outside of anyone's (government or corporations) responsibility at the moment"], "mt": "AI with no safety guardrails", "et": "Safety Removal from Open-Weight Frontier Models", "eb": "<p>There are two ways to release an AI model. You can let people use it through your website, keeping control of it. Or you can publish the model itself — the \"weights\" — so anyone can download it and run it on their own machine.<\/p>\n<p>Publishing has real benefits: researchers can study it, smaller countries and companies are not locked out, and nobody can switch it off. It also means anyone can modify it, and an industry has grown up doing exactly that: stripping out the refusals.<\/p>\n<p>A study catalogued 8,608 repositories of modified models posted publicly, and tested twenty of them. The unmodified models refused most harmful requests, complying with around one in five. The stripped versions complied with around four in five.<\/p>\n<p>These intermediaries — the people who quantise, fine-tune and re-post — are neither the original developer nor the final deployer. Every AI law in the world assigns duties to those two roles. No jurisdiction assigns any to the people in between.<\/p>\n<p>And there is no undo. Once weights are public they stay public, so safety removal is permanent and accumulates. This used to be a problem about weaker systems; it isn't any more. On one widely-used leaderboard, the gap between the best open and best closed model closed from 8% in January 2024 to 1.7% by February 2025.<\/p>", "d": "Some AI is released so anyone can download and change it. Its safety features can be stripped out and the AI passed on.", "td": "<p>Some AI companies release their models openly, so that anyone can download, run and change them. This has some benefits, as it means smaller researchers and organisations can study and build on them. <strong>But it also means the safety features can be removed.<\/strong> As open models catch up with the best closed ones, this now includes some of the most powerful AI systems ever developed.<\/p><p>These <strong>safety guardrails prevent<\/strong> you from using a model to make <strong>weapons of mass destruction<\/strong>, or launch <strong>cyberattacks<\/strong>, or to <strong>scam<\/strong> others and commit <strong>fraud<\/strong>, or fabricate <strong>deepfakes<\/strong>, or <strong>harm children<\/strong> or yourself. A study in 2024, however, showed that these guardrails can be undone for pennies’ worth of compute — and there are thousands of modified AI models on the internet available to download already.<\/p><p>The problem is that <strong>nobody is responsible for stopping this.<\/strong> Most AI laws give responsibilities to a company that builds a model and an organisation that uses it. Someone who makes cheap changes to a model and re-shares it falls outside these laws, and once a model is on someone else’s private computer, no company or government can see what it’s used for or take it back.<\/p>"}, "R07": {"id": "R07", "kind": "R", "g": "check", "a": "B5", "t": "AI building AI until we can't keep track", "s": "AI improving itself faster than people can follow, and possibly beyond our control.", "q": ["If AI is helping build the next AI, nobody can keep track of what's changed or why. You can't control what you can't follow. …", "AI could write itself out of guard rails for the next model without humans even knowing - hidden in millions of lines of code"], "mt": "AI building AI faster than we can oversee", "et": "Human Oversight Collapses as AI Automates AI R&D", "eb": "<p>AI companies are increasingly using their own AI systems to do the research that produces the next generation of AI systems. The stated goal is systems that improve themselves — and improve faster than people can follow.<\/p>\n<p>The UK's AI Security Institute reports two things from its own testing. It has found a way around the safety training of <strong>every system it has tested to date<\/strong>, reliably enough to extract information the model was built to refuse. And on its tests of whether a model can copy itself onto other machines, the best model of early 2023 scored under 5% on eleven of the Institute's twenty tests, while by summer 2025 two frontier models scored over 60%.<\/p>\n<p>The Institute is careful about what that second number means, and so should we be: these are simplified laboratory versions of the real thing, success in the test does not mean a system could do it in the world, and there is no evidence of any model trying to do it unprompted.<\/p>", "d": "AI increasingly helps build the next AI and could improve faster than people can follow it or switch it off.", "td": "<p class=\"lede\">Many people want AI systems to be aligned with our intentions and under our control. There is a risk, however, that a model could cause harm and be difficult to switch off.<\/p><p>Right now, people can still follow how an AI model is reasoning and acting, and step in if needed. <strong>But as AI begins to be used to help build newer AI, it could improve faster than safety checks and regulators can keep up.<\/strong> In other words, by the time they decided to switch a model off, it may be too late.<\/p><p>AI builds AI by writing pieces of code, creating synthetic training data and suggesting improvements to software engineers. As this gets more involved, <strong>it can be difficult for engineers to track what’s changing and why<\/strong> — and without the ability to notice and respond, workers can’t oversee and control an AI’s activity.<\/p><p>Before publicly announcing the existence of a new model, AI companies use and test it themselves — and they don’t have to say what problems they find. In the UK, one public body does have the expertise to follow the behaviour of frontier AI models — the AI Security Institute — however <strong>it has no power to compel access.<\/strong> This is outlined in another risk in this cluster on the risk map.<\/p><p>This issue emphasises the limits in oversight and control of new AI models. A related scenario, about countries racing to use AI to build AI, and in the process developing a model which is misaligned with human intentions and wellbeing, was discussed by experts but did not make the final map of 13 risks.<\/p>"}, "R09": {"id": "R09", "kind": "R", "g": "war", "a": "B5", "t": "Militaries letting machines decide who lives and dies", "s": "Targets picked faster than people can check, and innocent people hit by mistakes.", "q": ["The risk is that machines end up deciding who lives and who dies in a war, because they can pick targets faster than people can check them", "Innocent being attacked in error, due to inaccuracy", "AI shouldn't decide on a human life."], "mt": "AI choosing who gets targeted in war", "et": "Automated Human Rights and Targeting", "eb": "<p>The ability of AI to make sense of large amounts of military intelligence increases the risk that it is used to find the whereabouts of leaders, plan and simulate actions to go after them and then follow through on these plans with precision and fewer casualties.<\/p><p>As this becomes easier, powerful people in government may put military might over laws or diplomacy. The White House Deputy Chief of Staff for Policy and Homeland Security Advisor, Stephen Miller, said in January 2026:<\/p><p><em>“We live in a world in which, you can talk about international niceties and everything else, but we live in a world, in the real world — that is governed by strength, that is governed by force, that is governed by power. These are the iron laws of the world since the beginning of time.”<\/em><\/p><p><strong>The same capability is also used on ordinary targets, at volume.<\/strong> In urban warfare the hard part has always been telling combatants from civilians, building by building, with time and analysts you do not have. That difficulty worked as a brake on how destructive fighting in cities became. AI removes the brake.<\/p><p>During the US campaign against Iran in 2026, the <em>Washington Post<\/em> reported that Claude, running inside a military targeting platform, produced roughly a thousand prioritised targets on the first day — with coordinates, weapons recommendations, and an automatically written legal justification for each one. A Defense Department source told NBC News the opposite: that the system helps analysts sort intelligence and “does not directly provide targeting advice.” Both accounts are on the public record. Neither has been independently confirmed.<\/p><p>On 28 February 2026 — the first day of the operation — the Shajareh Tayyebeh primary school in Minab was destroyed. Reported death tolls range from about 155 to about 185, most of them children. Amnesty International found a US-manufactured Tomahawk missile was likely used, and said the strike was a serious breach of international humanitarian law which, depending on what the US knew, may amount to a war crime. More than 120 members of Congress have formally asked the Pentagon whether AI selected that target and whether a human verified it.<\/p><p>The Pentagon’s preliminary account is that intelligence had tagged the building as a factory or arms depot. <strong>That is widely reported as an alternative to AI involvement. It is not one.<\/strong> A targeting system does not sit alongside the intelligence picture; it ingests it. If Maven was running the target list that day — and the reporting says it was — then a label calling a school an arms depot is exactly the kind of data point it would have taken in, ranked, and packaged for approval, with a legal rationale attached. “The intelligence was wrong” describes an input. It does not describe what the system did with that input, and it does not explain why nothing between the label and the missile caught the error.<\/p>", "d": "AI can sift huge amounts of military intelligence to find, track and target people, including a country’s leaders.", "td": "<p>The ability of AI to make sense of large amounts of military intelligence increases the risk that it is used to find the whereabouts of leaders, plan and simulate actions to go after them and then follow through on these plans with more precision and fewer casualties. In 2026, the US captured the leader of Venezuela and killed Iran’s Supreme Leader after AI tools were used to map his daily movements and help confirm his location. As this becomes easier, powerful people in government may put military might over laws or diplomacy.<\/p><p>The White House Deputy Chief of Staff for Policy and Homeland Security Advisor, Stephen Miller, said in January 2026:<\/p><blockquote><em>“We live in a world in which, you can talk about international niceties and everything else, but we live in a world, in the real world — that is governed by strength, that is governed by force, that is governed by power. These are the iron laws of the world since the beginning of time.”<\/em><\/blockquote><p><strong>The same capability is also used on people in urban warfare, at great volume.<\/strong> Throughout 2026, US forces have been using an AI-fused targeting system supplied by Palantir to help process up to 1,000 targets in a single day by combining satellite images, drone footage and human intelligence reports into targeting plans. On February 28, 2026, a strike planned using this system killed over 120 young girls in Shajareh, Iran — at a primary school wrongly connected to a nearby naval base.<\/p>"}, "R10": {"id": "R10", "kind": "R", "g": "war", "a": "B5", "t": "Wars moving faster than people can stop them", "s": "Militaries using AI to speed up war beyond human control, with morality and the human cost pushed aside.", "q": ["AI speeding up wartime actions so conflicts grow faster and harder for people to slow or stop", "Removing human elements to war speeds up decisions in effective ways but removes the morality in decision making.", "The human cost of war being devalued."], "mt": "AI making wars faster and harder to control", "et": "Unprecedented Revolution in Warfare", "eb": "<p>It’s common for countries to compete with their rivals to create more &amp; more advanced and powerful military technology. Recent developments in AI raise the risk of a runaway dynamic, where agentic AI systems become a part of the command-and-control of large militaries.<\/p><p>This could lead to<\/p><ol><li><strong>Automation.<\/strong> If a human is asked to review a thousand AI-recommended targets in a single go they may be inclined to defer to the machine’s predictions without checking them properly.<\/li><li><strong>Escalation.<\/strong> Countries could lose control of their militaries to unpredictable and flawed AI systems. If these systems aren’t explicitly programmed to seek peace and de-escalate conflicts, they could quickly trigger a catastrophic war.<\/li><li><strong>Unaccountability.<\/strong> Countries could get away with war crimes. Because international humanitarian law is written in terms of human intentions and clear chains of command, the picture gets muddied when life-or-death decisions are made across a system with plausible deniability.<\/li><\/ol>", "d": "Militaries race to put AI that acts on its own into command and control, faster than humans can step in.", "td": "<p>Countries have always competed to build more powerful military technology. Recent AI developments raise the risk of a runaway version of this, where agentic AI systems (those that act on their own) become a part of the command-and-control of large militaries.<\/p><p>This could lead to:<\/p><ol><li><strong>Automation.<\/strong> Someone asked to review a thousand AI-recommended targets at once may simply defer to the machine rather than check each one.<\/li><li><strong>Escalation.<\/strong> Countries could lose control of their militaries to unpredictable and flawed AI systems. If these systems aren’t explicitly programmed to seek peace and de-escalate conflicts, they could quickly trigger a catastrophic war.<\/li><li><strong>Unaccountability.<\/strong> Countries could get away with war crimes. Because international humanitarian law is written in terms of human intentions and clear chains of command, the picture gets muddied when life-or-death decisions are made across a system with plausible deniability.<\/li><\/ol>"}, "R11": {"id": "R11", "kind": "R", "g": "war", "a": "B5", "t": "Weapons of mass destruction made easier", "s": "People using AI to learn more easily how to build chemical, biological or other mass-casualty weapons.", "q": ["AI can simplify complex technical steps needed to build dangerous weapons. This means groups or nations that previously lacked the skill or resources may now be able to develop them more easily.", "This risk is that our global security framework is built to secure physical materials, but now we are facing a threat that moves as freely as a software download."], "mt": "AI lowering barriers to weapons of mass destruction", "et": "AI-Enabled CBRN Uplift Outpaces Non-Proliferation Frameworks", "eb": "<p>AI has become so good at biology and chemistry that it can act like an expert lab assistant, giving thousands of people the knowledge of an elite, PhD-level scientist. This lowers the barrier to bad actors developing chemical &amp; biological weapons, including new viruses and toxins which could prove deadly in densely populated cities and places with limited public health systems.<\/p>", "d": "AI can act like an expert lab assistant, giving many more people the know-how to make chemical and biological weapons.", "td": "<p>AI has become so good at biology and chemistry that it can act like an expert lab assistant, giving thousands of people the knowledge of an elite, PhD-level scientist. This lowers the barrier to bad actors developing chemical &amp; biological weapons, including new viruses and toxins which could prove deadly in densely populated cities and places with limited public health systems.<\/p>"}, "N03": {"id": "N03", "kind": "N", "g": "war", "a": "B5", "t": "Attacks on, or failures of, essential services", "s": "AI used to attack hospitals, power, water or food supply, and nothing to fall back on when systems fail.", "q": ["Attacks on essential services. AI assisted cyberattacks on hospitals, power or water systems harm many civilians at once leaving civilians without vital support", "Over reliance. Too much reliance on AI. If there's an outage, for example, everything comes to a standstill. Backup needed."], "mt": "Attacks on, or failures of, essential services"}}, "drivers": [{"id": "D1", "t": "The Race to Cut Costs and Come First", "d": "Organisations are incentivised to use AI to cut staff and to beat rivals, even when that means worse work is produced or less time for checking.", "w": "Being first or cheapest would never come before being safe and fair, for companies or for countries.", "q": ["People want to innovate faster than others to gain dominance in this space. And that will ultimately determine global direction and result in more money flowing into certain economies.", "AI could pose a risk if it is rushed by tech companies", "… Governments themselves are actively looking to reduce costs in order to deliver more for their growing and ageing populations. Therefore the promises from AI to deliver efficiencies that involve removing resources (mainly people/workers) inherently become central to their policies …", "Risk of The West running AI at the expense of poorer countries"], "r": ["R07", "R10", "R12", "R14", "R15"], "wi": ["Capitalism is driving investments"], "x": "Being second is treated as losing"}, {"id": "D2", "t": "It Pays to Manipulate People", "d": "Using AI to hook people's attention and sway their beliefs can give money and power to those that do so.", "w": "No one, whether a company or a government, could gain money or power by manipulating people with AI.", "q": ["Worldview: profits over people (no matter at which cost)", "Young people being influenced / manipulated for profit", "The multi-nationals and governments controlling AI are focused on holding power and control. By controlling the flow of information and disinformation, they shape views to align with their aims", "Its use in politics to dictate the political leanings of certain groups, spread misinformation and contribute to the rise of political polarization in democratic nations"], "r": ["R01", "R03", "R06", "R08", "R15"], "wi": ["The political interests of the AI tech CEOs", "Companies/governments dont want us to actual think", "AI can start triggers a reward loop in the brain by releasing small bursts of dopamine"], "x": "The business model rewards dependency"}, {"id": "D3", "t": "What Was Hard Is Now Easy", "d": "In the past, skill and time were barriers to causing harm, however AI has removed an 'effort filter', so loads more people can try things.", "w": "Even when harmful uses of AI are easy, people would be protected from them.", "q": ["Dangers which were difficult before now become easy.", "Ai surveillance. AI eradicates cost, speed of analysis and scale at which surveillance take place. Data does not get used as it should.", "AI puts information that should be resticted into the hands of everyone, good and bad."], "r": ["R02", "R09"], "wi": ["despots and dictators can easily use this as a threat"], "x": "The effort filter is gone"}, {"id": "D4", "t": "A Few Companies Own the Foundations", "d": "Many people, organisations and governments depend on the same few firms, so their choices and mistakes spread widely.", "w": "No small group of companies would control AI, and everyone who needs it could get fair access.", "q": ["Unchecked capitalism and the centralisation of wealth and compute leading to something like techno-feudalism.", "The big AI providers being based in the USA or China makes us vulnerable to them. Our data is in the hands of their governments and data is an incredibly valuable currency", "Currently governments rely on US companies goodwill and voluntary agreements", "Power concentrated in the hands of major corporations that are motivated by profit rather than the well being of the wider population. It is clear that money talks and an underclass has been created"], "r": ["R01", "R05", "R06", "R07", "R08", "R12", "R14"], "wi": ["only can be created with massive investment"], "x": "A few companies own the foundations (same name)", "s7": {"card": "Computing power, data and models sit with few firms.", "open": "A small number of firms control the computing power, data and models others rely on, which gives them influence over what others can do."}}, {"id": "D5", "t": "Decisions Get Handed to the Machines", "d": "A person formally signs off, but in practice they just rubber stamp the judgment of an AI model. Maybe they can’t keep up with it, or have no real power to overrule it.", "w": "A person would always have the final say on decisions that matter, and there would be a fallback when AI fails.", "q": ["A decision is made by AI that an individual knows is wrong but can’t over ride it", "depending on AI chatbots, what if there is a power cut one day and we people can’t use AI? panic and chaos everywhere", "\"It is too much work; let the AI do it\" mentality"], "r": ["R02", "R03", "R06", "R09", "R10", "R15"], "wi": ["no human to check on the information/decision", "Governments choose to adopt AI in warfare"], "x": "Judgment handed over and not handed back"}, {"id": "D6", "t": "Checking Occurs on Companies' Own Terms", "d": "Checking an AI system takes time, money and skill — and the company being checked often decides who tests it and for how long.", "w": "AI would be checked by people independent of the companies that make it, including for unfair treatment of people.", "q": ["Firms pick their own testers and set time and access. No independent oversight currently has true access. Red flag AI companies mark their own homework.", "It is hard to publish findings the companies won't like …", "Bias being involved in the AI outputs"], "r": ["R03", "R05", "R06", "R11", "R14"], "wi": [], "x": "You can't see inside (partly)"}, {"id": "D7", "t": "The Gaps in Rules and Responsibilities", "d": "Laws often lag behind AI and stop at borders, blame can get passed around and it can be hard to challenge automated decisions.", "w": "Clear rules would protect people from harmful AI, whether it is used by companies or governments, and someone would always answer for the harm it causes.", "q": ["AI companies should be accountable for their services, if their tools cause harm, 'we' should have a framework to hold them responsible.", "Without a clear jurisdiction, there is no clear set of rules so no clear accountability.", "The possibility for abuse by the government and the extreme amount of damage it can cause"], "r": ["R01", "R03", "R05", "R06", "R08", "R09", "R10", "R11", "R12", "R14"], "wi": ["No Official Regulatory Body (UK - Worldwide)", "different legal systems in different countries"], "x": "Rules built for a slower, human world + No referee that works across borders"}], "futures": [{"id": "A1", "t": "Information and AI we can trust", "s": "AI and information people can rely on, because there are clear rules, people are accountable, and humans stay involved.", "q": ["We have AI systems we trust are directed correctly. They have clear boundaries and rules for how they operate. AI has clear \"I am unsure...\" statements.", "The news is still clearly written by people, with AI's role being to enable fact-checking.", "Communities involved as user of AI, designers, testers, decision makers, watchdogs"]}, {"id": "A2", "t": "Citizens and government deciding together", "s": "Governments, citizens and tech companies making decisions together, with groups like this assembly having real power.", "q": ["Shared responsibility: Politicians, citizens and technology companies work together to make decisions for the common good", "The goverment will drive this and set up consultative groups such as this one which will have power to deliver what is agreed", "People care about each other and have power and control over their own lives and real influence in government and even in how major corporations work"]}, {"id": "A3", "t": "Looking after one another", "s": "People shaping the future together and looking after each other, the vulnerable and nature.", "q": ["We trust each other to build a society with a common good", "Everyone has a say in how the country is run.  People will say how much fairer things are for everyone, how the vulnerable and nature are looked after", "People can get together to shape the world in a positive way."]}, {"id": "A4", "t": "Open, accountable power", "s": "Those in power are open and answerable, and people making money from AI do not get to check themselves.", "q": ["Not trusting those standing to make money from something to self regulate it and act on the world's best interests and not just their own", "Problems are highlighted by everyone, and politicians use their power in an honest way with citizens giving their opinion via secure websites and influencing decisions", "There is a broad agreement between those in power and the public as to what will be implemented and the timeline for this to be achieved."]}, {"id": "A5", "t": "AI checked by humans, a fairer society", "s": "AI always under human checks, and used to build a fairer, more equal society.", "q": ["Common understanding and cooperation across the planet that AI must always be checked and regulated by a Human.", "People now all have a universal income and their time is spent on more creative pursuits", "Everyone is involved and being respected for their contributions as AI is supporting with findings commonalities in views rather than creating polarisation."]}, {"id": "A6", "t": "AI as a shared tool for everyone", "s": "AI controlled by the many and used for problems that matter most to everyone.", "q": ["AI working for and with people and control of it in the hands of the many. Ai seen as a shared multinational resource or tool.", "We all have a shared belief to advance the good for all people and technology helps us achieve this at a faster pace", "AI is used for specific problems that require a lot of research and access to many resources therefore people are prioritising and focusing their attention to the most critical problems."]}, {"id": "A7", "t": "Happier lives, more free time", "s": "Less stress, less paperwork, and more time for family, friends, community and creativity.", "q": ["The world is a safer place. Breakthroughs in medical research and treatments. Reduced working time means more personal time for family, friends and less stress. More creativity.", "People are happier and have time to come together because AI advances have removed form filling, beaurocracy and laborious processes", "Something similar to the sentiment in 2020 lockdown, when people were more 'human' and priority was placed on wellbeing and looking after your peers"]}, {"id": "A8", "t": "Peace, health and shared resources", "s": "A more peaceful world, with better healthcare and food and energy shared more fairly.", "q": ["A more peaceful world where food and energy is available to everyone with Ai helping to make the world resources  spead more evenly so no wars are needed", "Ai being used to modernise healthcare on the battlefield/in war torn areas, providing people with a consistent level of treatment no matter the side or economic burdens of the area", "Cancer cured. Dementia reversed. No poverty related illnesses. Etc etc etc....."]}, {"id": "A9", "t": "Rules for weapons that act on their own", "s": "International agreements and clear responsibility for weapons that can act without a person deciding.", "q": ["International agreements on the production, capabilities and use of autonomous weapons", "Autonomy free zones where no autonomous weapons can go", "clear lines of responsibility for faults in the weapon systems and severe punishment"]}], "links": {"A1": [{"id": "R02", "why": "AI checks the news, so fake content no longer drowns out the truth.", "strength": "firm", "quote": "AI verifies news reports (no fake news)", "ref": "S6-0181"}, {"id": "N05", "why": "AI openly says when it is unsure, and people check its accuracy.", "strength": "firm", "quote": "We have AI systems we trust are directed correctly. They have clear boundaries and rules for how they operate. AI has clear \"I am unsure...\" statements.", "ref": "S6-0442"}, {"id": "R15", "why": "AI is a reference tool; people keep making the decisions.", "strength": "firm", "quote": "Ai used as a tool for reference not decision making", "ref": "S6-0825"}, {"id": "R14", "why": "People trust that the government regulates AI companies.", "strength": "firm", "quote": "Confidence that AI companies are regulated by the Governement", "ref": "S6-1043"}, {"id": "N11", "why": "AI companies are held liable for what their AI says.", "strength": "firm", "quote": "AI companies liable for the info it puts forward.", "ref": "S6-0837"}, {"id": "R05", "why": "Communities, not just companies, test and watch over AI.", "strength": "firm", "quote": "Communities involved as user of AI, designers, testers, decision makers, watchdogs", "ref": "S6-1411"}, {"id": "N10", "why": "Firms gain productivity from AI without laying people off.", "strength": "firm", "quote": "Ai used to help firms become more cost efficient and productive without any lay offs", "ref": "S6-0831"}, {"id": "R12", "why": "Every country tracks rogue AI use under common laws across nations.", "strength": "weak", "quote": "An AI Command & Control Centre for each country, that has established framework for identifying rogue AI usage, common AI laws across all nations", "ref": "S6-1491"}], "A2": [{"id": "R14", "why": "Governments worldwide agree rules strong enough that AI cannot outrun them.", "strength": "firm", "quote": "Governments around the world agree to regulation. Regulations put it in place so that AI cannot run away with itself.", "ref": "S6-0372"}, {"id": "R05", "why": "Independent, uncorruptible bodies, not the companies, oversee AI.", "strength": "firm", "quote": "Uncorruptable indenpendent bodies regulating AI.", "ref": "S6-0812"}, {"id": "R01", "why": "AI content must legally be labelled, e.g. watermarked images.", "strength": "firm", "quote": "I think any company or body using AI needs a method statement for transparency. e.g. for images with an AI watermark. It would be a legal requirement it needs to be flagged  ([member])", "ref": "S6-1023"}, {"id": "N06", "why": "Government investment makes sure everyone can access AI.", "strength": "firm", "quote": "government that invests in ai ensuring everyone has access", "ref": "S6-1222"}, {"id": "R02", "why": "Real-time fact-checking protects elections from misleading claims.", "strength": "weak", "quote": "The democratic process was protected with real-time AI fact-checking statements made by candidates", "ref": "S6-0433"}], "A3": [{"id": "R15", "why": "People still think freely and decide for themselves alongside AI.", "strength": "firm", "quote": "People discuss this with each other before involving AI.", "ref": "S6-0070"}, {"id": "R03", "why": "Children keep more human contact than AI contact, so relationships stay human.", "strength": "firm", "quote": "Children still have more human interaction than ai", "ref": "S6-0531"}, {"id": "N06", "why": "Power and wealth shared across nations; AI helps spread resources fairly.", "strength": "weak", "quote": "Power and wealth is shared across more or all nations and used for the common good of normal people and nature", "ref": "S6-0887"}, {"id": "R14", "why": "A new rules-based order steers AI for the common good.", "strength": "weak", "quote": "That a new rules based world order was introduced to work with AI for the common good.", "ref": "S6-1133"}], "A4": [{"id": "R14", "why": "Politicians put robust controls on how tech companies build and use AI.", "strength": "firm", "quote": "Politicians set up robust controls on tech companies and others in how they developed and used AI", "ref": "S6-1363"}, {"id": "R15", "why": "People keep their own judgement and challenge AI rather than defer.", "strength": "firm", "quote": "People retain their judgement abilities to differentiate right from wrong", "ref": "S6-1361"}, {"id": "R05", "why": "Those profiting from AI are not trusted to regulate themselves.", "strength": "firm", "quote": "Not trusting those standing to make money from something to self regulate it and act on the world's best interests and not just their own", "ref": "S6-0267"}, {"id": "R01", "why": "AI cannot be used to steer what people believe.", "strength": "firm", "quote": "AI cant be used to influence beliefs or opinions", "ref": "S6-0805"}, {"id": "N05", "why": "People always challenge AI answers, so mistakes get caught.", "strength": "firm", "quote": "People are using AI as another tool rather than the only tool available to them. They use it cautiously and they always challenge the responses and use their critical thinking.", "ref": "S6-0663"}, {"id": "N11", "why": "Companies and countries face sanctions for misusing AI.", "strength": "firm", "quote": "Sanctions are in place to deter companies and countries from misusing AI", "ref": "S6-1474"}, {"id": "N12", "why": "Families keep control over their children's data.", "strength": "firm", "quote": "We still have control over our childrens data", "ref": "S6-0532"}, {"id": "R02", "why": "Voters can find trustworthy facts; lies get debunked.", "strength": "weak", "quote": "I have the facts I need to enable me to make a vote ([member])", "ref": "S6-1001"}, {"id": "R07", "why": "An AI 'speed limit' and humans remain in charge.", "strength": "weak", "quote": "An ai 'speed limit'", "ref": "S6-1364"}], "A5": [{"id": "R15", "why": "People use AI as a helper, not over-relying, and keep questioning it.", "strength": "firm", "quote": "People are experienced in using AI effectively (using it properly and not over-relying on it)", "ref": "S6-0698"}, {"id": "N06", "why": "AI and AI education shared evenly across people and countries.", "strength": "firm", "quote": "a utopian world can only exist if the technology is distributed evenly. otherwise nations will become the new super powers", "ref": "S6-1226"}, {"id": "R01", "why": "AI content labelled and bots disclosed, so people aren't secretly steered.", "strength": "firm", "quote": "Mandatory age verification and transparent content labelling to sheild youth from exploitation", "ref": "S6-0565"}, {"id": "R03", "why": "AI points young people to real people and safeguards protect them.", "strength": "firm", "quote": "AI is honest about being an AI, helps with everyday tasks and support and points young people to real people for  worries", "ref": "S6-0564"}, {"id": "R02", "why": "AI bots banned from social media; AI finds common ground, not polarisation.", "strength": "firm", "quote": "The government ensured that AI bots were banned from all social media. Everyone on Social Media has to be offically identified to gain a profile", "ref": "S6-0432"}, {"id": "N10", "why": "AI assists work rather than eliminating jobs; universal income cushions change.", "strength": "firm", "quote": "AI was used to assist with work not eliminate jobs", "ref": "S6-0173"}, {"id": "N05", "why": "People are warned not to trust AI blindly and to sense-check its answers.", "strength": "weak", "quote": "It depends what you do ref engineering, computing.  One should warn against blindly trusting AI (such as market research or data) comparing to calculator where users must have approximate sense correct answer to spit errors", "ref": "S6-0892"}], "A6": [{"id": "N10", "why": "AI complements workers; government plans ahead and retrains people for jobs.", "strength": "firm", "quote": "AI complementing humans, not replacing them.", "ref": "S6-0683"}, {"id": "R05", "why": "Multiple bodies oversee how AI is developed.", "strength": "weak", "quote": "Multiple bodies should oversee the development of AI", "ref": "S6-1360"}, {"id": "R03", "why": "Technology serves young people instead of keeping them hooked.", "strength": "weak", "quote": "Technology should serve young people, not keep them hooked or over engaged", "ref": "S6-0548"}], "A7": [{"id": "R03", "why": "AI companions don't replace human connection; family and community stay central.", "strength": "firm", "quote": "AI companions have not replaced meaning human connection.", "ref": "S6-0707"}, {"id": "R15", "why": "People stay the decision-makers and think for themselves.", "strength": "firm", "quote": "People are talking about positive experiences using AI to solve their problems, remaining on the decision-maker role and not giving this to AI", "ref": "S6-0702"}, {"id": "N06", "why": "AI's benefits reach everyone, not just the rich.", "strength": "firm", "quote": "The human condition being supported by the use of ai for its betterment for all not just the rich", "ref": "S6-0823"}, {"id": "N10", "why": "People move into other work, and everyone is paid an income.", "strength": "firm", "quote": "The introduction of AI in roles currently performed by humans will allow for humans to work in other areas currently not filled.", "ref": "S6-1297"}, {"id": "R01", "why": "People less swayed by false propaganda.", "strength": "weak", "quote": "People are human again. More social, empathetic, less influenced by false propaganda.", "ref": "S6-1397"}], "A8": [{"id": "N06", "why": "Global AI effort serves poorer nations, not just rich ones.", "strength": "firm", "quote": "A global AI taskforce, not just for rich nations", "ref": "S6-1495"}, {"id": "N11", "why": "Countries and people are prosecuted for breaking AI law.", "strength": "firm", "quote": "Accountability from each country if they breached the treaty. If they break the law on AI they would be prosecuted ([member])", "ref": "S6-1036"}, {"id": "R10", "why": "An international weapons treaty, and lasting peace.", "strength": "weak", "quote": "Another great international weapons treaty like the nuclear arms treaties.", "ref": "S6-1176"}, {"id": "R11", "why": "AI finds antidotes quickly; bio/chem advances could serve healthcare.", "strength": "weak", "quote": "The advancement of bio/chem systems could further enhance healthcare rather than warfare. This positive reaction would be assimilated by the populus.", "ref": "S6-1236"}, {"id": "R09", "why": "People are punished when weapons malfunction or are misused.", "strength": "weak", "quote": "People are punished for malfunctioning or misusing weapons.", "ref": "S6-1185"}], "A9": [{"id": "R09", "why": "Kill switches and safety standards let people stop wrong targeting.", "strength": "firm", "quote": "Kill switches on any autonomous weapons", "ref": "S6-1152"}, {"id": "R10", "why": "International deals and kill switches keep autonomous war under human control.", "strength": "firm", "quote": "International agreements on the production, capabilities and use of autonomous weapons", "ref": "S6-1151"}, {"id": "N06", "why": "No weak or strong countries; all nations share in AI.", "strength": "firm", "quote": "everyone are on the same page and there are no weak/strong countries", "ref": "S6-0374"}, {"id": "N11", "why": "Clear responsibility and severe punishment for weapon system faults.", "strength": "firm", "quote": "clear lines of responsibility for faults in the weapon systems and severe punishment", "ref": "S6-1154"}, {"id": "R12", "why": "A transparent treaty and shared international rules on AI.", "strength": "weak", "quote": "Have a treaty with all the different countries they will not use AI against each other (no silos). Needs to be transparency.", "ref": "S6-1031"}]}, "groups": [{"k": "data", "n": "Everyone with data", "blurb": "Risks with no opt-out. You are exposed by having a phone, a medical record, a relative who took a DNA test.", "m": ["R06", "R08", "N09", "N12"]}, {"k": "public", "n": "Voters and the public", "blurb": "Risks to how a population forms a view, expresses it, and has it counted.", "m": ["R01", "R02", "N08", "N14"]}, {"k": "young", "n": "Children and learners", "blurb": "Risks that land on people while they are still forming the capacities the risk erodes.", "m": ["R03", "R15", "N13", "N05", "N06"]}, {"k": "work", "n": "People at work", "blurb": "Risks to people’s jobs, pay and fair treatment, and to an economy shaped by a handful of AI companies.", "m": ["R14", "N02", "N07", "N10"]}, {"k": "war", "n": "Civilians in conflict", "blurb": "Risks where the harm is physical, immediate, and borne by people with no way to reduce their exposure.", "m": ["R09", "R10", "R11", "N01", "N03"]}, {"k": "check", "n": "The bodies meant to check", "blurb": "Here the exposed party is an institution. If these fail, none of the others can be measured or answered.", "m": ["R05", "R07", "R12", "N04", "N11"]}], "areas": {"B1": "Information and manipulation", "B2": "Power and accountability", "B3": "Care, connection and thinking", "B4": "Fairness and livelihoods", "B5": "Safety and conflict"}, "expertDrivers": [["D4", "Rules built for a slower, human world", "Law assumes human pace, human intent, fixed products, physical ingredients and an identifiable person who decided."], ["D3", "You can't see inside", "Neither the public, nor regulators, nor often the builders can say what a system did or why."], ["D1", "The effort filter is gone", "Things once limited by cost, time and human effort are now effectively unlimited."], ["D6", "The business model rewards dependency", "These systems earn more the more you need them, and the incentive runs against restraint."], ["D2", "A few companies own the foundations", "Models, chips, computing power and training data sit with a handful of firms."], ["D7", "Judgment handed over and not handed back", "People and institutions stop practising what the machine does, and lose the ability to resume it."], ["D5", "Being second is treated as losing", "Competition between companies and between countries makes caution expensive."], ["D10", "No referee that works across borders", "No body has the information, the mandate and the power to act when harm crosses countries."], ["D8", "Nothing can be recalled", "Data collected and models published cannot be withdrawn, and get more dangerous as technology improves."], ["D9", "Everything is built on the same few things", "The same models, languages and datasets underneath everything, so everything shares the same blind spots."]], "extra": {"easy": {"t": "What makes people easy to harm", "s": "How easily people are influenced, misled or made to trust too much. Not listed as a driver: it explains why the drivers cause harm."}, "less": {"t": "Raised less often", "s": "Points raised in a few notes. Any of these can be brought forward in breakouts.", "sub": [{"id": "L-fled", "n": "People fleeing AI-driven wars"}, {"id": "L-land", "n": "Land, water and energy used by data centres"}, {"id": "L-dead", "n": "Using the data of people who have died"}, {"id": "L-watchdog", "n": "Watchdogs too close to the companies they check"}, {"id": "L-quit", "n": "Giving up on taking part"}, {"id": "L-ai2ai", "n": "AI systems talking to each other with no person involved"}, {"id": "L-drugs", "n": "AI used to make new drugs"}, {"id": "L-cruel", "n": "AI used to simulate cruelty and torture"}, {"id": "L-aware", "n": "What if an AI is judged to be self-aware"}, {"id": "L-abroad", "n": "Going abroad to use less regulated AI"}, {"id": "L-good", "n": "Missing out on the good AI could do"}, {"id": "L-create", "n": "Losing our creativity"}]}}, "notes": [{"g": "N10", "room": 13, "t": "Advancement in AI drives high unemployment", "d": "As AI technology infiltrates across industry sectors, the efficencies provided by AI will lead to job losses and high unelmplyment", "h": 3, "nov": 2}, {"g": "N10", "room": 13, "t": "People losing their jobs", "d": "People being replaced by AI in the workplace, made redundant.", "h": 2, "nov": 2}, {"g": "N10", "room": 13, "t": "Extinction of specific jobs and professions", "d": "AI can replace admin staff or staff doing manual, repetitive work without any particular or low level skills (that can be automated with zero, low or minimum risk of failure)", "h": 0, "nov": 2}, {"g": "N10", "room": 25, "t": "Unemployment", "d": "How do we stop at replacing peoples jobs and ultimately increasing our unemployment numbers and put more financial strain on benefits.", "h": 0, "nov": 2}, {"g": "N10", "room": 13, "t": "Creation of AI specific jobs", "d": "Following the hype, the usage and need for more AI, jobs around it will be needed (Trainers, Programmers etc). The risk would be who will train them, how they will be trained making sure to adhere to human-centred principles.", "h": 1, "nov": 2}, {"g": "N10", "room": 23, "t": "social cohesion during periods of ai driven transitions", "d": "social cohesion", "h": 0, "nov": 2}, {"g": "N08", "room": 2, "t": "Mass surveillance", "d": "People are going to be less likely to take part in protests for fear of being discovered or punished if AI-led surveillance tools are pushed out", "h": 2, "nov": 1}, {"g": "N08", "room": 2, "t": "AI-driven loss of privacy and mass surveillance", "d": "AI could combine facial recognition, location tracking, online activity and personal records to monitor individuals on a massive scale which can then lead to inequality and discrimination.", "h": 0, "nov": 1}, {"g": "N08", "room": 5, "t": "Ai surveillance", "d": "AI eradicates cost, speed of analysis and scale at which surveillance take place. Data does not get used as it should.", "h": 3, "nov": 1}, {"g": "N08", "room": 3, "t": "Erosion of personal freedoms", "d": "The ability of data to be collected and judgement (legal, moral) to be made/imposed by multiple agencies at a micro level. This could also introduce errors (e.g. mistaken identities) when implemented without human oversight.", "h": 1, "nov": 1}, {"g": "N08", "room": 1, "t": "control", "d": "with a digital society, control would be so easy if someone in power wanted to take total control", "h": 0, "nov": 1}, {"g": "N08", "room": 19, "t": "Possible impact on Human Rights", "d": "We may need to re-assess our values on government intrusion into individuals' online activities if effective safeguarding of our use of AI is imposed.", "h": 0, "nov": 1}, {"g": "N08", "room": 25, "t": "Govts able to use AI to discredit citizen(s)", "d": "No protection for an individual if a govt wanted to use AI to discredit political opposition or whistleblowers.", "h": 2, "nov": 2}, {"g": "N03", "room": 17, "t": "Attacks on essential services", "d": "AI assisted cyberattacks on hospitals, power or water systems harm many civilians at once leaving civilians without vital support", "h": 3, "nov": 2}, {"g": "N03", "room": 3, "t": "AI affecting society’s infrastructure", "d": "Ai could be used to cause havoc with food /supermarket supplies….Energy supplies….medical supplies…causing a complete shut down in society \nI think is could do as much damage to society as war could", "h": 1, "nov": 2}, {"g": "N03", "room": 13, "t": "Over reliance", "d": "Too much reliance on AI. If there's an outage, for example, everything comes to a standstill. Backup needed.", "h": 1, "nov": 2}, {"g": "L-fled", "room": 19, "t": "Increase in mass migration of people from war zones", "d": "It would affect migrants and host countries: migrants - uprooting their lives, destroying families and culture, economic stability; host countries - economic impact; social unrest (demonstrations and attacks against minority communities)", "h": 2, "nov": 2}, {"g": "L-fled", "room": 19, "t": "Unbalancing of world population", "d": "Because war so easy people panicking their country is going to be drawn into a war and deciding to move out of war zones. Not enough time for governments to take mitigating action", "h": 0, "nov": 2}, {"g": "L-land", "room": 25, "t": "Data centres vs loss of farmable or usable land", "d": "In a time of land only having so many viable years to produce, water shortages and energy crisis, lack of social housing, who determines whether and where data centres should be built. The danger is government will put these in countryside’s or places of natural beauty, this need regulating too.", "h": 2, "nov": 2}, {"g": "L-land", "room": 23, "t": "AI companies are unchecked in the resources they use.", "d": "Without limiting the resources companies can use, how do we stop them 'eating' up our water, etc", "h": 0, "nov": 2}, {"g": "N07", "room": 23, "t": "AI making Government borrowing unavoidable", "d": "We have already seen the effect that AI has on the bond market. Without detangling AI how do we stop the gap between countries wealth growing to far.", "h": 0, "nov": 1}, {"g": "N07", "room": 13, "t": "debt", "d": "at present all these large AI Companies are hugely in debt and the investors across the worls are very anxious to receive a dividend on their investments", "h": 0, "nov": 1}, {"g": "N02", "room": 2, "t": "AI has an unconscious bias towards non white people", "d": "Many studies have reported that AI and facial recognition struggles to differentiate between people of colour - in a world of masssurveillance this BAME people at further risk", "h": 0, "nov": 2}, {"g": "N02", "room": 13, "t": "AI hiring being discriminatory", "d": "Large language models are built from what information they are fed from the internet. They could carry prejudices which exist into society over into hiring. Also disabled people might not be able to interact with an AI interviewer effectively", "h": 1, "nov": 2}, {"g": "N02", "room": 13, "t": "Over-reliance on AI for recruitment", "d": "Human Resources professionals get replaced by AI models focusing on scanning through CVs, sifting applications, conducting interviews (or assess recorded answers to questions) making assumptions about protected characteristics based on writing style/qualifications/ethnic background/sex etc. that create biases and wrong decisions in the recruitment process.", "h": 0, "nov": 2}, {"g": "N02", "room": 2, "t": "damage equal opportunities", "d": "Could the data gained by AI harm society's fragile approach to equal opportunities?", "h": 1, "nov": 2}, {"g": "N02", "room": 25, "t": "Protected characterists", "d": "Ai doesn’t display the human qualities to be able to identify these protected characterises. Nor does each individual country, who will govern this?", "h": 1, "nov": 2}, {"g": "N02", "room": 1, "t": "People who blind", "d": "People who are blind using AI, making sure they are safe and secure. Be interesting to hearing what RNIB are using and to make it safe.", "h": 1, "nov": 2}, {"g": "N02", "room": 25, "t": "Vulnerability groups", "d": "How are vulnerable groups catered for; children and young people, vulnerable adults,people with mental capacity deficits or mental health conditions, protected characteristics, vulnerable workers, criminal justice and police context.", "h": 1, "nov": 2}, {"g": "N11", "room": 25, "t": "Safeguarding", "d": "Who has safeguarding responsibilities? Is this a globally agreed responsibility? Who will manage this?", "h": 1, "nov": 2}, {"g": "R03", "room": 9, "t": "Safeguarding of vulnerable children", "d": "Safeguarding of children when it comes to AI and not having the ability to learn for themselves. Danger of AI affecting those in positions of power over those with disabilities", "h": 0, "nov": 2}, {"g": "N11", "room": 25, "t": "Human Rights", "d": "How do the human rights and the UN’s rights of the child factor into this given it is not followed by every country?", "h": 1, "nov": 2}, {"g": "N04", "room": 25, "t": "No clear route for public complaint or redress", "d": "When an AI system causes harm or spreads false information about an individual, there is no designated public body to investigate or compel the company to fix it. The burden falls entirely on ordinary citizens to fight overseas tech companies alone.", "h": 1, "nov": 1}, {"g": "N04", "room": 25, "t": "Public perception of regulation", "d": "How would the general user know that the AI they are using has been proven to be safe. We have common labels on food and electronics which demonstrate certain testing criteria have been applied. Regulatory bodies may have to also agree on a set of criteria which demonstrate compliance in easy to understand ways.", "h": 0, "nov": 2}, {"g": "N12", "room": 3, "t": "Watch for data", "d": "There isn't a legislation that protects data properly in full not a cover it up.", "h": 0, "nov": 2}, {"g": "N14", "room": 3, "t": "RIGHT TO CHOOSE AI", "d": "I haven't seing a legislation that allows and protects the individual everything tk do with AI.", "h": 0, "nov": 2}, {"g": "N01", "room": 7, "t": "Loss of national autonomy", "d": "Lack of domestic AI infrastructure and overall capabilities allows foreign states to interfere in many aspects of what should be soverign decision making, e.g. recent removal of Star*** support to Ukraine and alleged attempted influence in UK voting by Russia", "h": 0, "nov": 2}, {"g": "N01", "room": 17, "t": "Private Companies deciding which side they support in a conflict.", "d": "The AI software is going to be so crucial to any military in the future. If private companies can turn it on and off then they can inlfluence those conflicts that they might have interests in or may have benefits for them and investors.", "h": 2, "nov": 2}, {"g": "N01", "room": 13, "t": "Geopolitics", "d": "Big tech companies being dominated by super powers", "h": 1, "nov": 2}, {"g": "N01", "room": 17, "t": "Change in Global power balance", "d": "If a couple of countries control the majority of the technology, all other countries are potentially at risk of military domination.", "h": 1, "nov": 2}, {"g": "N06", "room": 23, "t": "Risk of The West running AI at the expense of poorer countries", "d": "", "h": 0, "nov": 2}, {"g": "easy", "room": 1, "t": "Lack of AI education leaves people vulnerable", "d": "AI is present everywhere and people are unable to discern between what is helpful and what is harmful.", "h": 2, "nov": 2}, {"g": "easy", "room": 17, "t": "Lack of understanding by the public.", "d": "The public not being aware of the capacity AI has for rapidly spreading misleading or unverified information.", "h": 3, "nov": 2}, {"g": "easy", "room": 5, "t": "Trust", "d": "How do we receive this?", "h": 0, "nov": 2}, {"g": "N06", "room": 9, "t": "Inequality in learning standards", "d": "If quality of information is linked to cost of AI, then an inequality of learning standards could emerge.", "h": 3, "nov": 1}, {"g": "R15", "room": 9, "t": "fake learning", "d": "there is the risk of kids not learning the entire truth about history for example but instead a portion of it or even worst not learn at all", "h": 2, "nov": 2}, {"g": "R15", "room": 11, "t": "AI causing major breakdown in trust in young learners", "d": "Unable to tell truth from fiction and believing everything they read about or see online causing major trust/mental health issues issues", "h": 1, "nov": 1}, {"g": "R03", "room": 11, "t": "Age Group Limitations", "d": "Groupings for Primary, Junior, Senior, Adult in Learnings.\nLevels granted at relevant age groups", "h": 0, "nov": 2}, {"g": "R03", "room": 11, "t": "Company verification for Education", "d": "Companies providing educational programmes or learning modules for children/young adults must be acreddited/verified (Similar to PVG scheme)", "h": 0, "nov": 2}, {"g": "N06", "room": 11, "t": "Plagiarism rife and social disintergration", "d": "Perhaps hatred of the haves by the have-nots and social unrest", "h": 0, "nov": 2}, {"g": "L-quit", "room": 5, "t": "apathy", "d": "if people know the system is being manipulated into a pre determined outcome, they will think its a waste of time to engage", "h": 2, "nov": 2}, {"g": "N14", "room": 5, "t": "How are we heard ? - the general public", "d": "Decisions made without our knowledge based on what AI thinks we want.", "h": 0, "nov": 2}, {"g": "R02", "room": 5, "t": "lack of coverage for smaller groups", "d": "as an example only 2 parties appearing to be in the running at an election", "h": 0, "nov": 1}, {"g": "N09", "room": 1, "t": "High Risk of Data Breaches", "d": "All personal information collected by AI could end up in the wrong hands", "h": 0, "nov": 1}, {"g": "N09", "room": 1, "t": "Sensitive Information Leaked", "d": "People share very sensitive information that could end up in the public domain", "h": 0, "nov": 1}, {"g": "N09", "room": 1, "t": "Personal & Health", "d": "Our data being extracted and exploited for negative purposes.", "h": 0, "nov": 1}, {"g": "N13", "room": 1, "t": "AI uses data to mimic humans", "d": "AI could steal our identities", "h": 0, "nov": 1}, {"g": "N09", "room": 25, "t": "Private Information Leaks", "d": "Private AI companies hold huge amounts of civilian and small company/organisations data and records of interactions, if they leak alot of information would be released and alot of damage done to peoples lives.", "h": 0, "nov": 1}, {"g": "N09", "room": 9, "t": "Privacy of young peoples information", "d": "What safeguards are in place to protect young peoples data, from financial scams and impersonators", "h": 1, "nov": 1}, {"g": "N09", "room": 9, "t": "Use of sensitive data", "d": "Children may give sensitive data to AI companions. This information may cause them issues later in life if shared or made public.", "h": 1, "nov": 1}, {"g": "N09", "room": 2, "t": "Reliance on digital tools without a failsafe", "d": "Increasing reliance on AI to save our data for us risks us unwillingly exposing ourselves if someone else can modify AI to phish for data.", "h": 1, "nov": 1}, {"g": "N13", "room": 1, "t": "AI models could be hacked", "d": "People could end up speaking to somebody mimicking AI and they could be coerced into doing something terrible", "h": 0, "nov": 1}, {"g": "N09", "room": 2, "t": "Anonymous", "d": "I'm concerned about the ease that sensitive, damaging, dangerous or incorrect data/information can unloaded or downloaded anonymously. This leaves very little control , retort or retribution for anything done or used maliciously.", "h": 1, "nov": 1}, {"g": "N09", "room": 3, "t": "Future Data Use", "d": "Data handed over today used against you in the future. Innocently handing information that in the future could be used to your detriment.", "h": 0, "nov": 0}, {"g": "N09", "room": 3, "t": "Forever data", "d": "Growing up, being human involves changing and learning and making mistakes. While this is already chronicled on the internet in lots of cases, AI brings an even greater ability for this data to be permanently embedded in a person's record/online presence.", "h": 0, "nov": 1}, {"g": "N09", "room": 3, "t": "Data used to train ai destroyed, de-anonymised or otherwise used without consent", "d": "many old archived out of print books have been scanned and destroyed for ai training. ai is capable of finding the person behind data that was previously thought to be anonymous solely through social media posts in a manner of minutes, datasets taken for training or being shared with people all over the world in an outsourcing of ai checking to thousands of people through platforms such as prolific, where people are paid to sift through data and ai videos generated using said data, before evaluating its accuracy. we do not know where our data is going or what it is being used for anymore", "h": 0, "nov": 0}, {"g": "L-dead", "room": 1, "t": "People who are sadly passed away", "d": "Person uses AI, and then person sadly passed away. But in wrong hands dodgy companies could possibly use the info they gathered making people think person is still alive! Probably more on social media sites - Instagram and Facebook.", "h": 2, "nov": 2}, {"g": "R08", "room": 2, "t": "Future risks", "d": "AI will be able to be so accurate in predicting our futures that Governments and/or companies could used our data against us and influence life choices. Without us realising how manipulated we have been", "h": 1, "nov": 0}, {"g": "R14", "room": 21, "t": "Government employees having investments in AI companies can affect legislation", "d": "People in control of what laws get passed can have incentives offered to them by AI companies to weigh the laws that get passed or block in their favour", "h": 0, "nov": 2}, {"g": "R14", "room": 23, "t": "AI companies lobbying national and international bodies", "d": "With the immense capital that AI companies possesses, they could lobby national and international bodies to change legislations, regulations, and treaties to suit their needs.", "h": 0, "nov": 1}, {"g": "L-watchdog", "room": 25, "t": "Watchdogs relying on the tech giants they regulate", "d": "Public oversight loses its independence when regulators rely on tech industry insiders who move back and forth between the companies and the safety bodies.", "h": 0, "nov": 2}, {"g": "R14", "room": 21, "t": "The AI knowledge gap between companies and governance", "d": "AI companies cannot be trusted to regulate themselves, but do potential regulators have the skills and powers necessary to properly assess the safety and compliance of frontier models?\nHow do you assess models so large without using AI in the assessment process, and how do you trust the AI used to assess?", "h": 1, "nov": 1}, {"g": "R14", "room": 23, "t": "Lack of expertise on AI in national and international bodies", "d": "The public sector is not as lucrative as the private sector for professionals in AI to seek Public Office or employment in the public sector.", "h": 0, "nov": 1}, {"g": "R14", "room": 7, "t": "Corruption", "d": "Thinking of planning, which has a huge potential for large profits to be made", "h": 0, "nov": 1}, {"g": "R14", "room": 23, "t": "Legislating too late", "d": "Waiting for a disaster to happen and then reacting to it with remedial legislation is not an option. We must design an AI system that ensure humanity is kept alive", "h": 0, "nov": 1}, {"g": "R14", "room": 13, "t": "short timescales", "d": "the timescales for any effective actions are very short", "h": 0, "nov": 1}, {"g": "R14", "room": 13, "t": "not learning from past misatakes", "d": "there are lots of examples over the past few decades which need to be learned from - eg. social media: nuclear power etc", "h": 0, "nov": 1}, {"g": "L-abroad", "room": 1, "t": "Going abroad", "d": "Go abroad and use AI version in that country which is not regulated like in UK.", "h": 0, "nov": 1}, {"g": "R14", "room": 17, "t": "All AI is still AI", "d": "we are looking at the importance and missing minor infractions", "h": 2, "nov": 1}, {"g": "R01", "room": 9, "t": "Young people are open to being manipulated", "d": "There is a risk of young people being manipulated and unable to question the opinions/facts given to them by AI. This means children may be being given information with a bias and an agenda which AI companies may benefit from and/or paid adverts may be used in this way too. This would not be made clear to young people as it would be part of the sovial interaction with either AI companions and/or AI chatbots.", "h": 4, "nov": 1}, {"g": "R03", "room": 9, "t": "Risk of adult content to young people", "d": "young people have warped attitudes to sex and intimacy and influenced into aggresive and illegal practices. leading to intimacy issues in relationships", "h": 2, "nov": 2}, {"g": "R01", "room": 11, "t": "Subliminal Influence", "d": "Bad Actors could influence children to carry out dangerous acts (Terrorism)", "h": 2, "nov": 1}, {"g": "R02", "room": 11, "t": "Malicious state actors", "d": "The use of AI to demoralize the children of our country, thus attacking the integrity of a society and eroding trust in societal institutions.", "h": 2, "nov": 2}, {"g": "R03", "room": 11, "t": "AI Emotional Safety for Children and Learners.", "d": "It could mean an exposure to harmful content.", "h": 0, "nov": 1}, {"g": "R02", "room": 1, "t": "Truth and Reality", "d": "AI has led to having to constantly question what is true or real. In particular Gen Alpha and later Gens have never known anything else.", "h": 0, "nov": 1}, {"g": "R02", "room": 1, "t": "Endless Slop", "d": "Endless AI slop can be created so easily it overwhelms content distribution platforms and makes it difficult to find genuine art and education.", "h": 0, "nov": 1}, {"g": "N05", "room": 11, "t": "Unverified vs Verified Information", "d": "Verification checks need to be in place to scrutinise information being posted/used", "h": 0, "nov": 1}, {"g": "N05", "room": 25, "t": "People’ health", "d": "People’ health can be put at risk by misleading, misinformation and disinformation", "h": 3, "nov": 2}, {"g": "R02", "room": 17, "t": "Disinformation and deepfake", "d": "Fake images and videos make it hard for journalists and aid workers to verify what's happening in a conflict, so civilians lose protection and help.", "h": 3, "nov": 1}, {"g": "R01", "room": 7, "t": "failure to clearly designate as AI", "d": "if political or promotional information is not clearly marked as such, the information could be taken as gospel truth by the population", "h": 0, "nov": 1}, {"g": "N05", "room": 1, "t": "Ai always has an answer.", "d": "It does not say \"i do not know and have no reply\". Therefore these answers could be questionable!", "h": 0, "nov": 1}, {"g": "R02", "room": 17, "t": "Creating division to promote civil war", "d": "Using Ai disinformation to create hate groups and divide nations", "h": 2, "nov": 1}, {"g": "R02", "room": 17, "t": "AI being used to instigate internal conflicts.", "d": "AI can be used to spread misinformation and cause internal friction within a country. This would just be an escalation of what we have seen with the Russian interferance we have seen in multiple elections.", "h": 1, "nov": 1}, {"g": "R01", "room": 19, "t": "AI manipulating public interest", "d": "If AI manipulates public interest by feeding certain information to specific people, it can change how societies hold themselves together and can put people against each other. This will not only disrupt social harmony but also polarise people and potentially affect democratic processes.", "h": 0, "nov": 1}, {"g": "R01", "room": 19, "t": "AI used to disrupt the balance of society", "d": "People/ Companies in control of AI models could favour a certain interest and feed targeted information to people's algorithms. This will create tension and lead to civilian protests. And if that got worse, it could also lead to changes in who is in power.", "h": 0, "nov": 1}, {"g": "R02", "room": 19, "t": "Ai Data mining use to control conflict/war narratives and beliefs", "d": "Ai could be used for data mining, coercive and manipulative misinformation to steer war/conflict narratives", "h": 1, "nov": 1}, {"g": "R01", "room": 5, "t": "Thoughts and spending control", "d": "Company's can use trends to influence spending.\nAi can change your thought process and influence you to adopt their beliefs", "h": 0, "nov": 0}, {"g": "R02", "room": 5, "t": "Divided and spread hated", "d": "People are unaware that there are being swayed.\nBeliefs now become morals \nInfluence is present on all online platforms.", "h": 0, "nov": 1}, {"g": "R11", "room": 17, "t": "AI developing viruses", "d": "Developed in a poorly controlled environment", "h": 1, "nov": 0}, {"g": "L-drugs", "room": 17, "t": "AI developing artificial drugs", "d": "A low priced highly adictive drug hits the streets", "h": 0, "nov": 2}, {"g": "L-cruel", "room": 25, "t": "Simulated Cruelty", "d": "AI enabling increasingly realistic, interactive simulations of torture and psychological distress. Should regualtion tests ensure this cannot be implemented.\nI feel this would be very hard as different models/AI types can be built but consolidated under a unifiying system.", "h": 1, "nov": 2}, {"g": "R06", "room": 17, "t": "A unified watch list", "d": "It is essential that there is something similar to the terrorist watch list, in the absence of a unified approach in the UK, noting people who have made searches containing certain words such as the name of chemicals and known terrorist organisations, and that have had any sort of track record in similar activities.", "h": 0, "nov": 1}, {"g": "R11", "room": 17, "t": "Bond Villain become reality", "d": "Who knew Ian Fleming was right?", "h": 1, "nov": 1}, {"g": "R02", "room": 5, "t": "That political power falls into the wrong hands", "d": "Bad actors gain access to people's voting power for political and commercial gain", "h": 3, "nov": 0}, {"g": "R02", "room": 5, "t": "Political power falls into the wrong hands due to voter manipulation", "d": "People unwittingly gave their data to facebook and instagram. What is to stop bad actors doing something similar for political gain, with data we have already given freely", "h": 3, "nov": 0}, {"g": "R02", "room": 3, "t": "Political manipulation", "d": "Date manipulated to influence, for example, an election outcome. False data used to sway voters.", "h": 0, "nov": 0}, {"g": "R02", "room": 7, "t": "fake persona", "d": "AI creating fake persona for people to use in the democratic process", "h": 0, "nov": 0}, {"g": "R02", "room": 7, "t": "AI being used to manipulate voting for elections", "d": "parties that wanted to gain power can manipulate the general public by flooding social media", "h": 0, "nov": 0}, {"g": "R02", "room": 7, "t": "Voting", "d": "Elections manipulated", "h": 0, "nov": 0}, {"g": "R02", "room": 7, "t": "Polls", "d": "Being manipulated which can ultimately change how people vote", "h": 0, "nov": 0}, {"g": "R01", "room": 21, "t": "AI CEOs can put their political biases into the data that trains their AI", "d": "Can lead to radicalisation of users and incite incidents across the world\nMight lead to escalation of people's ideas to become more volatile", "h": 0, "nov": 1}, {"g": "R14", "room": 5, "t": "Ultimate power managed by only a few", "d": "Decisions are made for the few not the many.", "h": 1, "nov": 0}, {"g": "R14", "room": 7, "t": "MONOPLOY OF POWER", "d": "POWER INCREASINGLY RESIDES IN A FEW USA COMPANIES WHO HAVE A POLITCAL AGENDA OF THEIR OWN", "h": 0, "nov": 0}, {"g": "R14", "room": 21, "t": "AI companies becoming more powerful than states.", "d": "As AI relies on massive compute and as AI becomes faster and improve   tipEl=el; var k=el.getAttribute('data-k'), m=meta(k), L=LAYER[m.layer], h='';
  h+='<div class="tl"><span class="lay" style="--lc:'+L.c+'">'+L.n+'</span><b>'+esc(m.label)+'</b></div>';
  if(m.who&&m.layer!=='page')h+='<span>'+esc(m.who)+'</span>';
  if(msg)h+='<span>'+msg+'</span>';
  else if(m.link&&m.used&&m.used.length)h+='<span>Linked. Also shows in: '+esc(m.used.join(' · '))+'</span>';
  if(m.note)h+='<span class="was">'+esc(m.note)+'</span>';
  if(changed(k)){var o=BASE[k]||'';if(RICH[k])o=o.replace(/<[^>]+>/g,' ');h+='<span class="was">Was: '+esc(o.length>160?o.slice(0,160)+'…':o)+'</span><button type="button" data-revert="'+esc(k)+'">Put the original back</button>';}
  t.innerHTML=h; t.classList.add('on');
  var r=el.getBoundingClientRect(), tw=Math.min(340,window.innerWidth-24), th=t.offsetHeight;
  var y=r.bottom+8; if(y+th>window.innerHeight-150)y=Math.max(8,r.top-th-8);
  t.style.left=clamp(r.left,12,window.innerWidth-tw-12)+'px'; t.style.top=y+'px';
}
function caretAt(x,y){
  try{var r=document.caretRangeFromPoint?document.caretRangeFromPoint(x,y):null;
    if(!r&&document.caretPositionFromPoint){var p=document.caretPositionFromPoint(x,y);if(p){r=document.createRange();r.setStart(p.offsetNode,p.offset);}}
    if(r){var s=window.getSelection();s.removeAllRanges();s.addRange(r);}}catch(e){}
}
var ORIG={};
function activate(t,x,y){
  var k=t.getAttribute('data-k');
  t.setAttribute('contenteditable',RICH[k]?'true':'plaintext-only');
  if(t.contentEditable!=='plaintext-only'&&!RICH[k])t.setAttribute('contenteditable','true');
  ORIG[k]=get(k); t.focus(); if(x!=null)caretAt(x,y); tip(t);
}
function locked(t){return t.hasAttribute('data-lock')&&!document.body.classList.contains('unlocked');}
function inControl(t){return !!t.parentElement.closest('button,a,[role="button"],[role="tab"],summary');}
function clean(html){
  var d=document.createElement('div'); d.innerHTML=html;
  (function walk(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){
    if(c.nodeType===1){var tg=c.tagName.toLowerCase();
      if(['p','b','strong','i','em','br','ol','ul','li'].indexOf(tg)<0){walk(c);while(c.firstChild)n.insertBefore(c.firstChild,c);n.removeChild(c);}
      else{Array.prototype.slice.call(c.attributes).forEach(function(a){c.removeAttribute(a.name);});walk(c);}}
    else if(c.nodeType!==3)n.removeChild(c);});})(d);
  return d.innerHTML;
}

/* ---------- a quiet timer for reading the room's risks ---------- */
BASE['copy.timer.start']='Start the timer'; BASE['copy.timer.pause']='Pause the timer'; BASE['copy.timer.resume']='Carry on with the timer';
BASE['copy.timer.reset']='Reset the timer'; BASE['copy.timer.done']='Time’s up'; BASE['copy.timer.min']='min';
BASE['copy.timer.lab']='Reading the risks';
function Timer(key,minsKey,onTick){
  /* minsKey is the "7 min" in the breakout timings, so changing it there changes the timer */
  var st={end:null,left:null}, tick=0, el=null;
  try{var sv=JSON.parse(localStorage.getItem(key)||'null');if(sv)st=sv;}catch(e){}
  function total(){var n=parseFloat(T(minsKey));return (n>0?n:7)*60000;}
  function left(){return st.end?Math.max(0,st.end-Date.now()):(st.left==null?total():st.left);}
  function save(){try{localStorage.setItem(key,JSON.stringify(st));}catch(e){}}
  function fmt(ms){var s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function state(){var l=left();return {running:!!st.end&&l>0,done:l<=0,fresh:!st.end&&st.left==null,l:l,T:total()};}
  function ring(f){var r=9,c=2*Math.PI*r;return '<svg class="tico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="'+r+'" class="tr0"/>'+
    '<circle cx="12" cy="12" r="'+r+'" class="tr1" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+(c*(1-f)).toFixed(2)+'" transform="rotate(-90 12 12)"/>'+
    '<path d="M12 8v4l2.6 1.7" class="trh"/></svg>';}
  function render(){
    if(!el||!el.isConnected){clearInterval(tick);return;}
    var s=state(), act=s.done?'reset':s.running?'pause':s.fresh?'start':'resume';
    var txt=s.done?T('copy.timer.done'):s.fresh?Math.round(s.T/60000)+'<small>'+esc(T('copy.timer.min'))+'</small>':fmt(s.l);
    el.className='tmr'+(s.running?' run':'')+(s.done?' done':'')+(!s.fresh&&!s.running&&!s.done?' held':'');
    el.innerHTML='<button type="button" class="tgo" title="'+esc(T('copy.timer.'+act))+'" aria-label="'+esc(T('copy.timer.lab')+': '+(s.done?T('copy.timer.done'):s.fresh?Math.round(s.T/60000)+' '+T('copy.timer.min'):fmt(s.l))+'. '+T('copy.timer.'+act))+'">'+
      ring(s.fresh?0:1-s.l/s.T)+'<span class="tclk">'+txt+'</span></button>'+
      (!s.fresh?'<button type="button" class="tre" title="'+esc(T('copy.timer.reset'))+'" aria-label="'+esc(T('copy.timer.reset'))+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.2 4.2v4.6h4.6"/></svg></button>':'');
    if(onTick)onTick(s);
  }
  function loop(){clearInterval(tick);if(state().running)tick=setInterval(function(){var s=state();if(!el||!el.isConnected){clearInterval(tick);return;}
    if(s.done){st.end=null;st.left=0;save();clearInterval(tick);render();el.classList.add('ding');return;}
    var c=$('.tclk',el);if(c)c.textContent=fmt(s.l);var r=$('.tr1',el);if(r){var cc=2*Math.PI*9;r.setAttribute('stroke-dashoffset',(cc*(s.l/s.T)).toFixed(2));}
    if(onTick)onTick(s);},500);}
  function start(){st.end=Date.now()+left();st.left=null;save();render();loop();}
  function pause(){st.left=left();st.end=null;save();render();loop();}
  function reset(){st={end:null,left:null};save();render();loop();}
  function mount(node){el=node;
    el.addEventListener('click',function(e){if(e.target.isContentEditable)return;
      if(e.target.closest('.tre')){reset();var g=$('.tgo',el);if(g)g.focus();return;}
      if(e.target.closest('.tgo')){var s=state();if(s.done)reset();else if(s.running)pause();else start();var g2=$('.tgo',el);if(g2)g2.focus();}});
    render();loop();}
  return {mount:mount,start:start,reset:reset,state:state,render:render,poke:function(){if(onTick)onTick(state());}};
}
